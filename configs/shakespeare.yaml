# Model architecture (modern LLaMA-style: RoPE + RMSNorm + SwiGLU + flash attention)
model:
  vocab_size: 10000      # BPE vocabulary size
  d_model: 512           # embedding dimension
  n_heads: 8             # attention heads
  n_layers: 6            # transformer blocks
  d_ff: 1536             # SwiGLU hidden dim (3 gated matrices; sized to keep FFN params near a 2048-wide GELU MLP)
  max_seq_len: 512       # context window (raised 256 -> 512 for longer-range coherence)
  dropout: 0.1           # CHANGED 0.4 -> 0.1: the larger corpus removes the need for heavy dropout
  rope_theta: 10000.0    # RoPE base frequency

# Training
training:
  batch_size: 64
  learning_rate: 6.0e-4  # CHANGED 3e-4 -> 6e-4: GPT-2-small-style LR, fine with warmup + cosine decay
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 200
  max_steps: 8000        # CHANGED 5000 -> 8000: more data justifies (and rewards) longer training
  eval_interval: 500
  eval_steps: 100        # number of batches to average val loss / accuracy over
  checkpoint_dir: checkpoints/
  log_interval: 50
  label_smoothing: 0.0   # CHANGED 0.1 -> 0.0: with enough data, smoothing mostly just slows learning
  early_stopping_patience: 10   # generous; with a big corpus val loss keeps falling
  grad_accum_steps: 1    # raise to simulate a larger batch without more memory
  use_amp: true          # bf16 autocast on CUDA (no GradScaler needed)
  compile: false         # torch.compile — leave off on Windows unless Triton is set up

# Data
data:
  train_file: data/train.txt
  val_file: data/val.txt
  tokenizer_path: tokenizer/bpe.json

# Device
device: cuda             # falls back to cpu if cuda unavailable
